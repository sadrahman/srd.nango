name: Docker Check

on:
    push:
        branches:
            - master
            - staging/**
    pull_request:
    merge_group:

concurrency:
    group: docker-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    should-run:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.check.outputs.should_skip }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  predicate-quantifier: 'every'
                  filters: |
                      docs_only:
                          - 'docs/**'
            - name: Determine if should skip
              id: check
              run: |
                  # Run on PRs only if not docs only
                  # Always run on merge queue
                  # Always run on direct pushes to master (not merge queue bot)
                  IS_PR="${{ github.event_name == 'pull_request' }}"
                  IS_MERGE_QUEUE="${{ github.event_name == 'merge_group' }}"
                  IS_DIRECT_PUSH_TO_MASTER="${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-merge-queue[bot]' }}"
                  IS_DOCS_ONLY="${{ steps.filter.outputs.docs_only }}"

                  SHOULD_SKIP="true"
                  # Always run on merge queue and direct push to master
                  if [[ "$IS_MERGE_QUEUE" == "true" || "$IS_DIRECT_PUSH_TO_MASTER" == "true" ]]; then
                      SHOULD_SKIP="false"
                  # Run on PR only if not docs only
                  elif [[ "$IS_PR" == "true" && "$IS_DOCS_ONLY" != "true" ]]; then
                      SHOULD_SKIP="false"
                  fi

                  echo "should_skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT
    docker_check_job:
        needs: should-run
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              if: needs.should-run.outputs.should_skip != 'true'
              uses: actions/checkout@v4

            - name: Build the docker-compose stack
              if: needs.should-run.outputs.should_skip != 'true'
              run: |
                  set -euo pipefail
                  docker compose config --quiet
                  docker compose up -d

            - name: Verify database health and server readiness
              if: needs.should-run.outputs.should_skip != 'true'
              run: |
                  set -euo pipefail

                  for attempt in {1..30}; do
                    db_container_id="$(docker compose ps -q nango-db)"
                    if [ -n "$db_container_id" ] \
                        && docker compose ps --status running --services | grep -qx 'nango-db' \
                        && docker inspect --format '{{.State.Health.Status}}' "$db_container_id" | grep -qx 'healthy'; then
                      break
                    fi

                    if [ "$attempt" -eq 30 ]; then
                      echo "PostgreSQL did not become healthy"
                      docker compose ps
                      docker compose logs --no-color nango-db
                      exit 1
                    fi

                    sleep 2
                  done

                  redis_container_id="$(docker compose ps -q nango-redis)"
                  if [ -z "$redis_container_id" ] \
                      || ! docker inspect --format '{{.State.Health.Status}}' "$redis_container_id" | grep -qx 'healthy'; then
                    echo "Redis did not become healthy"
                    docker compose ps
                    docker compose logs --no-color nango-redis
                    exit 1
                  fi

                  for attempt in {1..30}; do
                    if curl --fail --silent --show-error http://localhost:3003/ready; then
                      echo
                      break
                    fi

                    if [ "$attempt" -eq 30 ]; then
                      echo "Nango server did not become ready"
                      docker compose ps
                      docker compose logs --no-color nango-db nango-server
                      exit 1
                    fi

                    sleep 2
                  done

                  curl --fail --silent --show-error http://localhost:3003/health
                  echo
              shell: bash

            - name: Collect Docker diagnostics
              if: failure() && needs.should-run.outputs.should_skip != 'true'
              run: |
                  docker compose ps
                  docker compose logs --no-color

            - name: Tear down Docker Compose stack
              if: always() && needs.should-run.outputs.should_skip != 'true'
              run: docker compose down --volumes --remove-orphans
